<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>곽과장의 연구기록 - 종말예언 : 어둠탐사기록</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app-header"></div>

<main class="list-page">
  <div class="list-page-head">
    <h1>곽과장의 연구기록</h1>
    <p class="sub">백일몽 주식회사 내부에서만 열람되던 곽과장의 연구 기록. 작성은 관리자만 할 수 있습니다.</p>
    <button id="write-research-btn" class="primary-button" hidden>연구기록 작성</button>
  </div>

  <div class="list-controls">
    <div class="list-controls-row">
      <input type="search" id="search-input" class="search-input" placeholder="제목으로 검색..." />
      <select id="sort-select" class="sort-select"></select>
    </div>
  </div>

  <div id="doc-list" class="doc-list">
    <p class="loading">불러오는 중...</p>
  </div>
</main>

<script type="module">
  import { getUserProfile, isAdminProfile } from "./firebase-init.js";
  import {
    mountHeader,
    displayAuthorName,
    formatDate,
    escapeHtml,
    categoryBadges,
    SORT_OPTIONS,
    sortDocs,
  } from "./common.js";
  import { listDocuments, getLikeCount, getCommentCount } from "./docs.js";

  let viewerProfile = null;
  let allDocs = [];
  let activeSort = "latest";
  let searchInput;
  let sortSelect;
  const writeBtn = document.getElementById("write-research-btn");

  mountHeader({
    requireAuth: true,
    onReady: async (user, profile) => {
      viewerProfile = profile;
      writeBtn.hidden = !isAdminProfile(profile);
      await loadDocs();
      renderFilteredList();
    },
  });

  writeBtn.addEventListener("click", () => {
    location.href = "write.html?board=gwak";
  });

  searchInput = document.getElementById("search-input");
  searchInput.addEventListener("input", renderFilteredList);

  buildSortSelect();
  function buildSortSelect() {
    sortSelect = document.getElementById("sort-select");
    sortSelect.innerHTML = SORT_OPTIONS.map((o) => `<option value="${o.key}">${o.label}</option>`).join("");
    sortSelect.value = activeSort;
    sortSelect.addEventListener("change", () => {
      activeSort = sortSelect.value;
      renderFilteredList();
    });
  }

  const profileCache = new Map();
  async function profileFor(uid) {
    if (!profileCache.has(uid)) {
      profileCache.set(uid, await getUserProfile(uid).catch(() => null));
    }
    return profileCache.get(uid);
  }

  // 이 탭에는 isGwak === true 문서만 쌓인다. index.html(메인 문서 목록)에는 나오지 않는다.
  async function loadDocs() {
    const docs = (await listDocuments()).filter((d) => d.isGwak);
    allDocs = await Promise.all(
      docs.map(async (d, i) => {
        const [authorProfile, likeCount, commentCount] = await Promise.all([
          profileFor(d.authorUid),
          getLikeCount(d.id).catch(() => 0),
          getCommentCount(d.id).catch(() => 0),
        ]);
        return {
          ...d,
          authorDisplay: displayAuthorName(viewerProfile, authorProfile),
          likeCount,
          commentCount,
          _order: i,
        };
      })
    );
  }

  function cardHtml(d) {
    return `
      <a class="doc-card" href="view.html?id=${encodeURIComponent(d.id)}">
        ${categoryBadges(d)}
        ${d.code ? `<div class="doc-code">${escapeHtml(d.code)}</div>` : ""}
        <h2 class="doc-title">${escapeHtml(d.title || "(제목 없음)")}</h2>
        <div class="doc-meta">
          <span>${escapeHtml(d.authorDisplay)}</span>
          <span>${formatDate(d.createdAt)}</span>
          <span>추천 ${d.likeCount}</span>
          <span>댓글 ${d.commentCount}</span>
        </div>
      </a>
    `;
  }

  function renderFilteredList() {
    const host = document.getElementById("doc-list");
    const keyword = searchInput.value.trim().toLowerCase();

    const filtered = allDocs.filter((d) => !keyword || (d.title || "").toLowerCase().includes(keyword));

    if (allDocs.length === 0) {
      host.innerHTML = '<p class="empty">아직 기록된 연구 기록이 없습니다.</p>';
      return;
    }
    if (filtered.length === 0) {
      host.innerHTML = '<p class="empty">조건에 맞는 문서가 없습니다.</p>';
      return;
    }

    host.innerHTML = sortDocs(filtered, activeSort).map(cardHtml).join("");
  }
</script>
</body>
</html>
