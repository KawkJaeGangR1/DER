<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>문서 작성 - 종말예언 : 어둠탐사기록</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app-header"></div>

<main class="write-page">
  <h1 id="write-heading">괴담 문서 작성</h1>

  <div class="field-row">
    <span class="field-label">분류 <span class="optional">(1개 이상 선택, 중복 선택 가능)</span></span>
    <div id="category-checks" class="category-check-group"></div>
    <p id="gwak-category-note" class="hint" hidden>분류: 백일몽 주식회사 (곽과장의 연구기록 문서는 분류가 고정됩니다)</p>
    <div id="subcategory-groups"></div>
  </div>

  <div class="field-row">
    <label class="field-label">식별 코드 <span class="optional">(선택, 예: Qterw-A-37)</span>
      <input type="text" id="doc-code" placeholder="Qterw-A-37" />
    </label>
  </div>

  <div class="field-row">
    <label class="field-label">제목
      <input type="text" id="doc-title" placeholder="괴담 제목" required />
    </label>
  </div>

  <div class="editor-toolbar" role="toolbar" aria-label="서식 도구">
    <button type="button" data-cmd="bold" title="굵게"><b>B</b></button>
    <button type="button" data-cmd="italic" title="기울임"><i>I</i></button>
    <button type="button" data-cmd="strikeThrough" title="취소선"><s>S</s></button>
    <button type="button" data-cmd="red" title="붉은색">A</button>
    <button type="button" data-cmd="redact" title="검열(■)">■</button>
    <span class="toolbar-divider" aria-hidden="true"></span>
    <button type="button" data-cmd="insertUnorderedList" title="글머리 기호(목록)">•</button>
    <button type="button" data-cmd="outdent" title="내어쓰기">←</button>
    <button type="button" data-cmd="indent" title="들여쓰기">→</button>
    <button type="button" data-cmd="insertHorizontalRule" title="구분선(가로줄)">─</button>
    <span class="toolbar-divider" aria-hidden="true"></span>
    <button type="button" data-cmd="removeFormat" title="서식 지우기">지우기</button>
  </div>

  <div id="doc-body" class="doc-editor paper" contenteditable="true"
       data-placeholder="여기에 괴담 문서를 작성하세요..."></div>

  <p id="error-msg" class="error-msg" hidden></p>

  <div class="write-actions">
    <button id="save-btn" class="primary-button">저장</button>
    <button id="delete-btn" class="danger-button" hidden>이 문서 삭제</button>
  </div>
</main>

<script type="module">
  import { isAdminProfile } from "./firebase-init.js";
  import {
    mountHeader,
    CATEGORIES,
    SUBCATEGORIES,
    getDocCategories,
    getDocSubTags,
    makeSubTagKey,
    escapeHtml,
  } from "./common.js";
  import { getDocument, createDocument, updateDocument, deleteDocument } from "./docs.js";
  import { sanitizeHtml } from "./sanitize.js";

  const params = new URLSearchParams(location.search);
  const editingId = params.get("id");
  const boardParam = params.get("board"); // "gwak" 이면 곽과장의 연구기록 새 글

  const titleInput = document.getElementById("doc-title");
  const codeInput = document.getElementById("doc-code");
  const categoryChecksHost = document.getElementById("category-checks");
  const gwakNote = document.getElementById("gwak-category-note");
  const subcategoryGroupsHost = document.getElementById("subcategory-groups");
  const bodyEl = document.getElementById("doc-body");
  const errorMsg = document.getElementById("error-msg");
  const saveBtn = document.getElementById("save-btn");
  const deleteBtn = document.getElementById("delete-btn");
  const heading = document.getElementById("write-heading");

  let currentUser = null;
  let currentProfile = null;
  // isGwakBoard: write.html?board=gwak 로 새 글을 쓰는 경우. isGwakDoc: 이미 isGwak=true로
  // 저장된 기존 문서를 수정하는 경우. 둘 중 하나라도 참이면 분류가 백일몽 주식회사로 고정된다.
  let isGwakBoard = false;
  let isGwakDoc = false;

  // styleWithCSS를 끄면 굵게/기울임/취소선이 <b>/<i>/<strike> 같은 일반 태그로 만들어진다.
  // (이전에는 켜져 있어서 <span style="font-weight:bold">처럼 인라인 스타일로 만들어졌는데,
  //  sanitizeHtml이 색상 스타일 외의 스타일은 걸러내면서 굵게 표시가 저장 시 통째로 사라졌음)
  document.execCommand("styleWithCSS", false, false);

  function renderCategoryChecks() {
    categoryChecksHost.innerHTML = CATEGORIES.map(
      (c) => `
        <label class="check-chip">
          <input type="checkbox" class="category-check" value="${escapeHtml(c)}" />
          ${escapeHtml(c)}
        </label>
      `
    ).join("");
    categoryChecksHost.querySelectorAll(".category-check").forEach((cb) => {
      cb.addEventListener("change", () => renderSubcategoryGroups());
    });
  }

  function getCheckedCategories() {
    return Array.from(categoryChecksHost.querySelectorAll(".category-check:checked")).map((cb) => cb.value);
  }

  function setCategoryChecks(categories) {
    categoryChecksHost.querySelectorAll(".category-check").forEach((cb) => {
      cb.checked = categories.includes(cb.value);
    });
  }

  // 곽과장의 연구기록(새 글 또는 기존 글 수정)이면 분류가 백일몽 주식회사로 고정된다.
  function activeCategories() {
    if (isGwakBoard || isGwakDoc) return ["백일몽 주식회사"];
    return getCheckedCategories();
  }

  // 선택된 상위 태그마다 그 태그에 딸린 하위 태그 체크박스 그룹을 다시 그린다.
  // presetSubTags를 넘기면 그 값들을 초기 체크 상태로 쓰고(문서 불러오기),
  // 없으면 다시 그리기 전 현재 체크돼 있던 값들을 최대한 유지한다.
  function renderSubcategoryGroups(presetSubTags) {
    const checkedCats = activeCategories();
    const preserve =
      presetSubTags ||
      new Set(
        Array.from(subcategoryGroupsHost.querySelectorAll(".subtag-check:checked")).map((cb) => cb.value)
      );
    subcategoryGroupsHost.innerHTML = checkedCats
      .filter((c) => (SUBCATEGORIES[c] || []).length > 0)
      .map(
        (c) => `
          <div class="subcategory-group" data-category="${escapeHtml(c)}">
            <p class="hint">${escapeHtml(c)} 하위 태그 <span class="optional">(선택)</span></p>
            <div class="subcategory-checks">
              ${(SUBCATEGORIES[c] || [])
                .map((s) => {
                  const key = makeSubTagKey(c, s);
                  return `
                    <label class="check-chip">
                      <input type="checkbox" class="subtag-check" value="${escapeHtml(key)}" ${
                        preserve.has(key) ? "checked" : ""
                      } />
                      ${escapeHtml(s)}
                    </label>
                  `;
                })
                .join("")}
            </div>
          </div>
        `
      )
      .join("");
  }

  function getCheckedSubTags() {
    return Array.from(subcategoryGroupsHost.querySelectorAll(".subtag-check:checked")).map((cb) => cb.value);
  }

  function enterGwakMode(headingText) {
    isGwakBoard = true;
    heading.textContent = headingText;
    categoryChecksHost.hidden = true;
    gwakNote.hidden = false;
    renderSubcategoryGroups();
  }

  renderCategoryChecks();

  mountHeader({
    requireAuth: true,
    onReady: async (user, profile) => {
      currentUser = user;
      currentProfile = profile;
      if (editingId) {
        await loadForEdit();
      } else if (boardParam === "gwak") {
        if (!isAdminProfile(profile)) {
          location.href = "research.html";
          return;
        }
        enterGwakMode("곽과장의 연구기록 작성");
      } else {
        renderSubcategoryGroups();
      }
    },
  });

  async function loadForEdit() {
    heading.textContent = "괴담 문서 수정";
    const docData = await getDocument(editingId);
    if (!docData) {
      errorMsg.textContent = "문서를 찾을 수 없습니다.";
      errorMsg.hidden = false;
      saveBtn.disabled = true;
      return;
    }
    const canEdit = docData.authorUid === currentUser.uid || isAdminProfile(currentProfile);
    if (!canEdit) {
      location.href = `view.html?id=${encodeURIComponent(editingId)}`;
      return;
    }
    titleInput.value = docData.title || "";
    codeInput.value = docData.code || "";
    if (docData.isGwak) {
      enterGwakMode("곽과장의 연구기록 수정");
      renderSubcategoryGroups(new Set(getDocSubTags(docData)));
    } else {
      setCategoryChecks(getDocCategories(docData));
      renderSubcategoryGroups(new Set(getDocSubTags(docData)));
    }
    isGwakDoc = !!docData.isGwak;
    bodyEl.innerHTML = docData.bodyHtml || "";
    deleteBtn.hidden = false;
  }

  document.querySelectorAll(".editor-toolbar button").forEach((btn) => {
    btn.addEventListener("click", () => {
      bodyEl.focus();
      const cmd = btn.dataset.cmd;
      if (cmd === "red") {
        document.execCommand("foreColor", false, "#c0392b");
      } else if (cmd === "redact") {
        applyRedact();
      } else {
        document.execCommand(cmd, false, null);
      }
    });
  });

  // 검열(■): 별도 <span>으로 감싸는 대신, 커서(또는 선택 영역) 위치에 일반 텍스트로
  // ■ 문자를 삽입한다. 그냥 타이핑한 것과 동일하게 처리되어, 나중에 지우거나
  // 다른 글자를 이어 써도 검은 박스 스타일이 남아있는 문제가 생기지 않는다.
  function applyRedact() {
    const sel = window.getSelection();
    if (!sel.rangeCount || !bodyEl.contains(sel.anchorNode)) return;
    const selectedLength = sel.toString().length;
    const insertText = "■".repeat(selectedLength || 1);
    document.execCommand("insertText", false, insertText);
  }

  // 나무위키 등 다른 곳에서 복사해온 글을 붙여넣으면, 원본의 색상·링크·표 같은 서식은
  // 버리고 이 사이트가 지원하는 서식(굵게/기울임/취소선/빨간색)만 남겨 자동으로 정리한다.
  // 문단 구분은 최대한 유지하되, 완벽하게 원본 그대로 옮겨지진 않으니 붙여넣은 뒤 한 번
  // 훑어보고 다듬는 걸 권장합니다.
  bodyEl.addEventListener("paste", (e) => {
    e.preventDefault();
    const html = e.clipboardData && e.clipboardData.getData("text/html");
    let cleaned;
    if (html) {
      cleaned = sanitizeHtml(html);
    } else {
      const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
      cleaned = text
        .split(/\r?\n/)
        .map((line) => `<p>${escapeHtml(line)}</p>`)
        .join("");
    }
    document.execCommand("insertHTML", false, cleaned);
  });

  saveBtn.addEventListener("click", async () => {
    errorMsg.hidden = true;
    const title = titleInput.value.trim();
    const code = codeInput.value.trim();
    const categories = activeCategories();
    const subTags = getCheckedSubTags();
    const isGwak = isGwakBoard || isGwakDoc;
    const bodyHtml = sanitizeHtml(bodyEl.innerHTML.trim());

    if (!categories.length) {
      errorMsg.textContent = "분류를 최소 1개 선택해주세요.";
      errorMsg.hidden = false;
      return;
    }
    if (!title) {
      errorMsg.textContent = "제목을 입력해주세요.";
      errorMsg.hidden = false;
      return;
    }
    if (!bodyHtml || bodyEl.textContent.trim() === "") {
      errorMsg.textContent = "본문을 입력해주세요.";
      errorMsg.hidden = false;
      return;
    }

    saveBtn.disabled = true;
    try {
      if (editingId) {
        await updateDocument(editingId, { title, code, categories, subTags, isGwak, bodyHtml });
        location.href = `view.html?id=${encodeURIComponent(editingId)}`;
      } else {
        const newId = await createDocument({
          title,
          code,
          categories,
          subTags,
          isGwak,
          bodyHtml,
          authorUid: currentUser.uid,
        });
        location.href = `view.html?id=${encodeURIComponent(newId)}`;
      }
    } catch (err) {
      // 어떤 이유로 실패했는지 화면에서 바로 보이게 실제 오류 코드/메시지를 같이 표시한다.
      // (개발자 도구 콘솔에도 남기니, 계속 실패하면 F12 → Console 탭 내용을 보내주세요.)
      console.error("문서 저장 실패:", err);
      const detail = (err && (err.code || err.message)) || "알 수 없는 오류";
      errorMsg.textContent = `저장에 실패했습니다. (${detail}) 잠시 후 다시 시도해주세요.`;
      errorMsg.hidden = false;
      saveBtn.disabled = false;
    }
  });

  deleteBtn.addEventListener("click", async () => {
    if (!confirm("이 문서를 정말 삭제하시겠습니까? 되돌릴 수 없습니다.")) return;
    await deleteDocument(editingId);
    location.href = "index.html";
  });
</script>
</body>
</html>
